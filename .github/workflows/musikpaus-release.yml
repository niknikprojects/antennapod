name: Build Musikpaus release APK

# Signed release APK of the musikpaus branch. Upstream's workflows only run
# on master/develop and pull requests, so they stay untouched.
on:
  workflow_dispatch:
  push:
    branches:
      - musikpaus

jobs:
  build-android-release:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: gradle/actions/setup-gradle@v5

    # The keystore lives in repo secrets so every build has the same signature
    # and installs over the previous one.
    - name: Set up signing
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
          echo "::error::Secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD must be set"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
        cat >> gradle.properties <<PROPS
        releaseStoreFile=$RUNNER_TEMP/release.p12
        releaseStorePassword=$KEYSTORE_PASSWORD
        releaseKeyAlias=${KEY_ALIAS:-finampbrainz}
        releaseKeyPassword=$KEYSTORE_PASSWORD
        PROPS

    - run: ./gradlew --console=plain :app:assemblePlayRelease

    # Name the APK after the build so versions are told apart on the phone
    - run: mv app/build/outputs/apk/play/release/app-play-release.apk musikpaus-${{ github.run_number }}.apk

    - uses: actions/upload-artifact@v6
      with:
        name: musikpaus-${{ github.run_number }}
        path: musikpaus-${{ github.run_number }}.apk
        compression-level: 0
